<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of a joint hinge with orbiting markers representing rheumatology">
  <!-- upper limb segment -->
  <path d="M150,140 L232,220" fill="none" stroke="var(--color-text)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  <!-- lower limb segment -->
  <path d="M232,220 L300,340" fill="none" stroke="var(--color-text)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- secondary parallel bone contours -->
  <path d="M164,150 L246,228" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M246,232 L314,350" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- joint capsule -->
  <circle cx="232" cy="220" r="34" fill="none" stroke="var(--muted)" stroke-width="2" />

  <!-- range-of-motion arc -->
  <path d="M180,268 A100,100 0 0 1 232,150" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" />

  <!-- secondary hinge lines suggesting cartilage striations -->
  <path d="M206,196 L212,242" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M256,198 L252,244" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />

  <!-- orbiting inflammation marker dots (accent) -->
  <circle cx="232" cy="220" r="58" fill="none" stroke="var(--muted)" stroke-width="1" stroke-dasharray="1 10" stroke-linecap="round" />
  <circle cx="290" cy="188" r="5" fill="var(--cat-medical)" />
  <circle cx="276" cy="266" r="3.5" fill="var(--cat-medical)" />
  <circle cx="188" cy="196" r="3" stroke="var(--cat-medical)" stroke-width="2" fill="none" />
</svg>

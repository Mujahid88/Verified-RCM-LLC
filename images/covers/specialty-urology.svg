<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of a flow line passing through a valve node, representing urology">
  <!-- secondary echo line, upper -->
  <path d="M 90 155 C 140 138, 175 158, 205 178 C 222 189, 232 193, 245 194" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- secondary echo line, lower -->
  <path d="M 245 286 C 265 289, 285 300, 320 300 C 355 300, 380 312, 410 322" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- primary flow line passing through the valve -->
  <path d="M 60 195 C 120 170, 170 195, 205 222 C 222 235, 232 239, 240 240 C 248 241, 258 246, 278 243 C 320 237, 355 258, 420 285" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- radiating ticks around the valve -->
  <path d="M 266 214 L 278 200" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 214 214 L 202 200" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 266 266 L 278 280" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>
  <path d="M 214 266 L 202 280" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round"/>

  <!-- valve node -->
  <circle cx="240" cy="240" r="34" fill="none" stroke="var(--cat-surgical)" stroke-width="2.5"/>
  <circle cx="240" cy="240" r="11" fill="none" stroke="var(--cat-surgical)" stroke-width="2"/>

  <!-- flow indicator dots -->
  <circle cx="130" cy="182" r="3" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="185" cy="208" r="3" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="300" cy="235" r="4" fill="var(--cat-surgical)" stroke="none"/>
</svg>

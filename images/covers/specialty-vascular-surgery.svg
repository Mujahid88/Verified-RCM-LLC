<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of branching blood vessels forking at accented nodes, representing vascular surgery">
  <!-- primary trunk -->
  <path d="M240,410 C238,375 244,345 238,308" fill="none" stroke="var(--color-text)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- primary branches from main fork -->
  <path d="M238,308 C214,282 196,266 166,224" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M238,308 C262,282 280,266 312,224" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- secondary sub-branches, left -->
  <path d="M166,224 C146,204 128,196 100,176" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M166,224 C158,196 164,170 150,138" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M100,176 C86,164 78,158 64,150" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- secondary sub-branches, right -->
  <path d="M312,224 C334,204 352,196 382,178" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M312,224 C320,196 314,170 328,138" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M382,178 C396,168 404,162 418,156" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- fine capillary offshoots near base -->
  <path d="M238,360 C222,352 210,348 196,344" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M240,360 C256,352 268,348 282,344" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- accent nodes at branch points -->
  <circle cx="238" cy="308" r="5.5" fill="var(--cat-surgical)"/>
  <circle cx="166" cy="224" r="4.5" fill="var(--cat-surgical)"/>
  <circle cx="312" cy="224" r="4.5" fill="var(--cat-surgical)"/>
</svg>

<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of a path that loops back on itself, symbolizing the denials appeal cycle">
  <!-- secondary background motion arcs -->
  <path d="M 355 145 A 150 150 0 0 1 385 260" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" />
  <path d="M 130 350 A 130 130 0 0 1 110 250" fill="none" stroke="var(--muted)" stroke-width="1.75" stroke-linecap="round" />

  <!-- small claim-stack motif -->
  <path d="M 318 122 L 352 122" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" />
  <path d="M 312 133 L 352 133" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" />
  <path d="M 318 144 L 346 144" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" />

  <!-- primary outer loop: claim submitted, denied, cycling around -->
  <path d="M 240 150 A 90 90 0 1 1 150 240" fill="none" stroke="var(--color-text)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />

  <!-- the loop bends back on itself toward the appeal -->
  <path d="M 150 240 C 145 190 190 165 225 190" fill="none" stroke="var(--color-text)" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" />

  <!-- accent: the turning point of the appeal, tightening back inward -->
  <path d="M 225 190 C 245 205 230 230 205 222" fill="none" stroke="var(--cat-medical-billing)" stroke-width="3.25" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="205" cy="222" r="4.5" fill="var(--cat-medical-billing)" />
</svg>

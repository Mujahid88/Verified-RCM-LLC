<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of gentle orbiting arcs around a central circle, symbolizing the ongoing cycle of obstetric and gynecologic care">
  <!-- outer orbit hint, sparse arc -->
  <path d="M 322.5 97.11 A 165 165 0 0 1 382.89 322.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- secondary orbit -->
  <path d="M 329.27 272.49 A 95 95 0 1 1 207.51 150.23" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- primary orbit arc -->
  <path d="M 117.84 195.54 A 130 130 0 1 1 284.46 362.16" fill="none" stroke="var(--color-text)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- core circle -->
  <circle cx="240" cy="240" r="45" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- small radiating ticks from core -->
  <path d="M 201.03 262.5 L 183.71 272.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 240 195 L 240 175" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />
  <path d="M 284.32 247.81 L 304.01 251.28" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" />

  <!-- accented segment on the primary orbit -->
  <path d="M 284.46 362.16 A 130 130 0 0 1 195.54 362.16" fill="none" stroke="var(--cat-surgical)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- accent point on the orbit -->
  <circle cx="240" cy="370" r="7" fill="var(--cat-surgical)" />
</svg>

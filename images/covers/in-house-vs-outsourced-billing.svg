<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Balance scale weighing two sides, representing the trade-off between in-house and outsourced medical billing">
  <!-- vertical stand -->
  <line x1="240" y1="195" x2="240" y2="335" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round"/>
  <!-- foot -->
  <path d="M240,335 L205,365 M240,335 L275,365" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="205" y1="365" x2="275" y2="365" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round"/>
  <!-- tilted beam -->
  <line x1="145" y1="175" x2="335" y2="215" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round"/>
  <!-- left hangers -->
  <path d="M145,175 L115,250 M145,175 L165,250" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- left pan arc -->
  <path d="M115,250 Q140,278 165,250" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round"/>
  <!-- right hangers -->
  <path d="M335,215 L305,295 M335,215 L355,295" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- right pan arc -->
  <path d="M305,295 Q330,323 355,295" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round"/>
  <!-- beam end pivots -->
  <circle cx="145" cy="175" r="3.5" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="335" cy="215" r="3.5" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <!-- central pivot, accented -->
  <circle cx="240" cy="195" r="7" fill="var(--cat-practice-resources)"/>
</svg>

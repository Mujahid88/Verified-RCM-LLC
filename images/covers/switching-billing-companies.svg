<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of a baton being handed off between two curved paths, symbolizing switching billing companies">
  <!-- secondary background texture -->
  <path d="M 120,360 Q 240,330 360,360" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" />
  <circle cx="150" cy="150" r="14" fill="none" stroke="var(--muted)" stroke-width="2" />
  <circle cx="335" cy="330" r="10" fill="none" stroke="var(--muted)" stroke-width="2" />

  <!-- left entity: open bracket-like arc (origin company) -->
  <path d="M 96,190 A 58,58 0 0 1 96,310" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" />

  <!-- right entity: open bracket-like arc (new company) -->
  <path d="M 384,170 A 62,62 0 0 0 384,292" fill="none" stroke="var(--muted)" stroke-width="2.5" stroke-linecap="round" />

  <!-- primary line A: approach from origin to handoff point -->
  <path d="M 118,258 Q 165,225 202,236" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" />

  <!-- primary line B: departure from handoff point to new company -->
  <path d="M 278,246 Q 320,262 362,238" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" />

  <!-- the baton: short accented segment bridging the two lines -->
  <line x1="202" y1="236" x2="278" y2="246" stroke="var(--cat-practice-resources)" stroke-width="3.5" stroke-linecap="round" />
  <circle cx="202" cy="236" r="4.5" fill="var(--cat-practice-resources)" />
  <circle cx="278" cy="246" r="4.5" fill="var(--cat-practice-resources)" />
</svg>

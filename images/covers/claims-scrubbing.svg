<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of scattered claim points funneling down through filtering stages to a single clean, submitted claim">
  <!-- incoming claims: scattered points above the funnel -->
  <circle cx="140" cy="106" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="172" cy="118" r="4" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="204" cy="100" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="240" cy="112" r="4" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="276" cy="100" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="308" cy="118" r="4" fill="none" stroke="var(--muted)" stroke-width="2"/>
  <circle cx="340" cy="106" r="5" fill="none" stroke="var(--muted)" stroke-width="2"/>

  <!-- funnel: primary outer walls -->
  <path d="M150,132 L240,330" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M330,132 L240,330" fill="none" stroke="var(--color-text)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- funnel: secondary inner converging lines -->
  <path d="M178,132 L240,330" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M206,136 L240,330" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M274,136 L240,330" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M302,132 L240,330" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- filter stages: sieve bars crossing the funnel, narrowing with it -->
  <path d="M177,190 L303,190" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round"/>
  <path d="M195,230 L285,230" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M213,270 L267,270" fill="none" stroke="var(--color-text)" stroke-width="2" stroke-linecap="round"/>

  <!-- convergence point: the one clean, scrubbed claim -->
  <circle cx="240" cy="330" r="7" fill="var(--cat-medical-billing)"/>

  <!-- submission: accented line and arrow leaving the funnel -->
  <path d="M240,338 L240,372" fill="none" stroke="var(--cat-medical-billing)" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M228,360 L240,374 L252,360" fill="none" stroke="var(--cat-medical-billing)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>

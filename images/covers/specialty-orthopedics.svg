<svg viewBox="0 0 480 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Abstract line art of a joint hinge, two angled bone segments meeting at a pivot, representing orthopedics">
  <!-- outer decorative range-of-motion arc -->
  <path d="M 151.4 207.5 A 85 85 0 0 1 298.6 207.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="1 9"/>
  <!-- inner range-of-motion arc -->
  <path d="M 182.9 214.7 A 55 55 0 0 1 267.1 214.7" fill="none" stroke="var(--muted)" stroke-width="2" stroke-linecap="round" stroke-dasharray="2 8"/>

  <!-- bone 1 rails (secondary) -->
  <path d="M 133.3 124.4 L 218.3 254.4" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 146.7 115.6 L 231.7 245.6" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- bone 2 rails (secondary) -->
  <path d="M 222.1 257.5 L 352.1 307.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 227.9 242.5 L 357.9 292.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- end tick marks -->
  <path d="M 131.6 125.5 L 148.4 114.5" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M 351.4 309.3 L 358.6 290.7" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-linecap="round"/>

  <!-- primary bone segments meeting at pivot -->
  <path d="M 140 120 L 225 250" fill="none" stroke="var(--color-text)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 225 250 L 355 300" fill="none" stroke="var(--color-text)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- pivot accent -->
  <circle cx="225" cy="250" r="16" fill="none" stroke="var(--cat-surgical)" stroke-width="2.5"/>
  <circle cx="225" cy="250" r="3.5" fill="var(--cat-surgical)"/>
</svg>
